services:
  whisper:
    build:
      context: ./public/nextjs-faster-whisper/whisper-service
    environment:
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      QWEN_API_URL: http://qwen:11434
      QWEN_MODEL: qwen2.5:3b
    ports:
      - "8000:8000"
    volumes:
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped


  
  db:
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    ports:
      - "38472:5432"
    environment:
      POSTGRES_USER: news_admin
      POSTGRES_PASSWORD: R8vN9xW2pL5mQk
      POSTGRES_DB: news_broadcast_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  cosyvoice:
    # CosyVoice's PyTorch/CUDA base image is amd64-only. Run it through
    # Docker Desktop's amd64 emulation on Apple Silicon hosts.
    platform: linux/amd64
    build:
      context: ./public/nextjs-faster-whisper/cosyvoice-service
    ports:
      - "9500:50000"
    volumes:
      - cosyvoice-models:/root/.cache
    restart: unless-stopped

volumes:
  whisper-models:
  qwen-models:
  postgres-data:
  minio-data:
  redis-data:
  cosyvoice-models:
