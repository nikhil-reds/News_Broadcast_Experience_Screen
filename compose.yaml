services:
  whisper:
    build:
      context: ./public/nextjs-faster-whisper/whisper-service
    environment:
      WHISPER_MODEL: small
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      QWEN_TRANSLATION_URL: http://qwen:11434
      QWEN_TRANSLATION_MODEL: qwen2.5:3b
    ports:
      - "8000:8000"
    volumes:
      - whisper-models:/root/.cache/huggingface
    depends_on:
      qwen:
        condition: service_healthy
    restart: unless-stopped

  qwen:
    image: ollama/ollama:latest
    container_name: qwen
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      QWEN_TRANSLATION_MODEL: qwen2.5:3b
    volumes:
      - qwen-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama serve & server_pid=$!; until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull $${QWEN_TRANSLATION_MODEL}; wait $${server_pid}"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10


  
  db:
    image: postgres:16-alpine
    restart: always
    shm_size: 128mb
    ports:
      - "38472:5432"
    environment:
      POSTGRES_USER: news_admin
      POSTGRES_PASSWORD: R8vN9xW2pL5mQk
      POSTGRES_DB: news_broadcast_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_admin -d news_broadcast_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  cosyvoice:
    # CosyVoice's PyTorch/CUDA base image is amd64-only. Run it through
    # Docker Desktop's amd64 emulation on Apple Silicon hosts.
    platform: linux/amd64
    build:
      context: ./public/nextjs-faster-whisper/cosyvoice-service
    environment:
      COSYVOICE_DEVICE: ${COSYVOICE_DEVICE:-auto}
    ports:
      - "9500:50000"
    volumes:
      - cosyvoice-models:/root/.cache
      - ./public/nextjs-faster-whisper/cosyvoice-service/server.py:/opt/CosyVoice/server.py:ro
    command: ["python3", "/opt/CosyVoice/server.py", "--port", "50000", "--model_dir", "iic/CosyVoice2-0.5B"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:50000/docs', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Isolated CUDA candidate. Keep the CPU service above running while this
  # image is built and benchmarked; switch traffic only after validation.
  cosyvoice-gpu:
    platform: linux/amd64
    build:
      context: ./public/nextjs-faster-whisper/cosyvoice-service
      dockerfile: Dockerfile.gpu
    environment:
      COSYVOICE_DEVICE: cuda
    ports:
      - "9501:50000"
    gpus: all
    volumes:
      - cosyvoice-gpu-models:/root/.cache
      - ./public/nextjs-faster-whisper/cosyvoice-service/server.py:/opt/CosyVoice/server.py:ro
    command: ["python3", "/opt/CosyVoice/server.py", "--port", "50000", "--model_dir", "iic/CosyVoice2-0.5B"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:50000/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      start_period: 600s
      retries: 20
    restart: unless-stopped

  chatterbox:
    profiles: ["cpu-tts"]
    image: news-chatterbox-v3-local:5de7a54
    build:
      context: ./public/chatterbox-service
      dockerfile: Dockerfile.v3
    environment:
      CHATTERBOX_DEVICE: cpu
      CHATTERBOX_MODEL_DIR: /root/.cache/huggingface/hub/models--ResembleAI--chatterbox/snapshots/5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports: ["127.0.0.1:9600:9601"]
    volumes: ["chatterbox-gpu-models:/root/.cache/huggingface:ro"]
    networks: [audio-local]
    restart: unless-stopped

  chatterbox-gpu:
    image: news-chatterbox-v3-local:5de7a54
    build:
      context: ./public/chatterbox-service
      dockerfile: Dockerfile.v3
    environment:
      CHATTERBOX_DEVICE: cuda
      CHATTERBOX_MODEL_DIR: /root/.cache/huggingface/hub/models--ResembleAI--chatterbox/snapshots/5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    expose: ["9601"]
    gpus: all
    volumes: ["chatterbox-gpu-models:/root/.cache/huggingface:ro"]
    networks: [audio-local]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9601/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 10
    restart: unless-stopped

  chatterbox-local-api:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:9601:9601"]
    volumes: ["./public/chatterbox-service/local-proxy.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [default, audio-local]
    depends_on:
      chatterbox-gpu:
        condition: service_healthy
    restart: unless-stopped

networks:
  audio-local:
    internal: true

volumes:
  whisper-models:
  qwen-models:
  postgres-data:
  minio-data:
  redis-data:
  cosyvoice-models:
  cosyvoice-gpu-models:
  chatterbox-models:
  chatterbox-gpu-models:

